<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lower Thirds Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="eyebrow">PREMIERE PRO 26 · UXP</div>
      <h1>LOWER THIRDS STUDIO</h1>
    </header>

    <!-- MOGRT -->
    <section class="card">
      <div class="section-title">1 · MOGRT TEMPLATE</div>
      <div class="row">
        <div id="mogrtName" class="file-name">No template selected</div>
        <button id="btnMogrt" class="sm">Browse</button>
      </div>
      <button id="btnInspect" class="secondary">Inspect Parameters</button>
      <div id="paramList" class="param-list"></div>
    </section>

    <!-- DATA -->
    <section class="card">
      <div class="section-title">2 · DATA SOURCE</div>
      <div class="row">
        <div id="csvName" class="file-name">No spreadsheet selected</div>
        <button id="btnCsv" class="sm">Browse</button>
      </div>
      <div class="hint">Supports .xlsx, .csv, .tsv (first sheet / first block)</div>
      <div id="preview" class="preview"></div>
      <div id="rowCount" class="hint"></div>
    </section>

    <!-- MAPPING -->
    <section class="card">
      <div class="section-title">3 · COLUMN MAPPING</div>
      <p class="hint">Map spreadsheet columns → MOGRT text params</p>
      <div id="mapping"></div>
    </section>

    <!-- OPTIONS -->
    <section class="card">
      <div class="section-title">4 · PLACEMENT</div>
      <div class="grid2">
        <label>Video track
          <select id="track"></select>
        </label>
        <label>Duration, sec
          <input id="duration" type="number" min="0.1" step="0.1" value="6">
        </label>
      </div>
      <label>Start offset, sec
        <input id="start" type="number" min="0" step="0.1" value="0">
      </label>
      <label class="check"><input id="markers" type="checkbox"> Use sequence markers for placement</label>
    </section>

    <!-- ACTIONS -->
    <button id="btnGenerate" class="primary" disabled>GENERATE LOWER THIRDS</button>
    <button id="btnClear" class="secondary" disabled>CLEAR DATA</button>

    <div class="progress-wrap"><div id="progress"></div></div>
    <div id="status" class="status">Ready</div>
  </main>

  <script src="index.js"></script>
</body>
</html>
